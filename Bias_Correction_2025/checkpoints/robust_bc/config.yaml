data:
  augment: true
  batch_size: 16
  cache_data: false
  lower_percentile: 1.0
  norm_method: percentile
  num_workers: 0
  nwp_path: d:/shivanshu/MY FILES/data/gfs model/GFS_3h_JJAS_india_2019to23_filled.nc
  obs_path: d:/shivanshu/MY FILES/data/imdaa data truth image/IMDAA_3h_JJAS_india_2019to23_filled.nc
  train_years:
  - 2019
  - 2020
  - 2021
  - 2022
  upper_percentile: 99.0
  val_years:
  - 2023
  variable_name: rf
device: cuda
evaluation:
  fss_scales:
  - 1
  - 3
  - 5
  - 9
  - 15
  metrics:
  - MAE
  - RMSE
  - Pearson_R
  - NSE
  - KGE
  - POD_5mm
  - CSI_5mm
  - ETS_5mm
  thresholds:
  - 1.0
  - 5.0
  - 10.0
  - 20.0
  - 50.0
experiment:
  description: Production bias correction model for Indian precipitation
  deterministic: true
  name: IITM_BiasCorrection_v1
  seed: 42
loss:
  data_range: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  focal_threshold: 0.1
  focal_weight: 0.5
  gradient_weight: 0.2
  mse_weight: 1.0
  nll_weight: 0.3
  spectral_weight: 0.0
  ssim_weight: 0.3
  ssim_window: 11
  type: compound
model:
  base_filters: 64
  dropout: 0.1
  in_channels: 10
  n_residual: 2
  name: MSUANet
  num_levels: 4
  out_channels: 1
  uncertainty: true
  use_attention: true
  use_self_attention: true
training:
  T_0: 10
  T_mult: 2
  batch_size: 32
  betas:
  - 0.9
  - 0.999
  checkpoint_dir: checkpoints/robust_bc
  early_stopping_min_delta: 1.0e-05
  early_stopping_patience: 30
  eta_min: 1.0e-07
  eval_every: 1
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  keep_last: 10
  learning_rate: 0.0001
  log_dir: logs/robust_bc
  num_epochs: 100
  optimizer: AdamW
  save_every: 5
  scheduler: CosineAnnealingWarmRestarts
  use_amp: true
  warmup_epochs: 5
  warmup_start_lr: 1.0e-07
  weight_decay: 1.0e-05
